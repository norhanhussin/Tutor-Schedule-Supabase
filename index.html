
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر مواعيدي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="authBox" class="hidden"></div>
<div id="appShell" class="hidden">

    <div class="wrap">

        <header>
            <h1>دفتر مواعيدي</h1>

            <svg class="underline" viewBox="0 0 140 10">
                <path d="M2 6 Q 35 -2, 70 6 T 138 6"
                      stroke="#D6A34C"
                      stroke-width="3"
                      fill="none"
                      stroke-linecap="round"/>
            </svg>

            <div class="today-date" id="todayDate"></div>
        </header>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">إجمالي الطلاب</span>
            <strong class="stat-value" id="totalStudentsStat">0</strong>
        </div>

        <div class="stat-card">
            <span class="stat-label">مواعيد اليوم</span>
            <strong class="stat-value" id="todaySessionsStat">0</strong>
        </div>

        <div class="stat-card">
            <span class="stat-label">مواعيد غدًا</span>
            <strong class="stat-value" id="tomorrowSessionsStat">0</strong>
        </div>
    </div>

    <div class="section-title">
        <span class="dot"></span>
        فلتر الأيام
    </div>

    <div class="ribbon" id="ribbon"></div>

    <div class="focus-grid">
        <div class="focus-card">
            <h3>
                <span class="dot"></span>
                اليوم
            </h3>
            <div class="schedule-list" id="todayList"></div>
        </div>

        <div class="focus-card">
            <h3>
                <span class="dot"></span>
                غدًا
            </h3>
            <div class="schedule-list" id="tomorrowList"></div>
        </div>
    </div>

    <div class="section-title">
        <span class="dot"></span>
        <span id="dayViewTitle">جدول اليوم</span>
    </div>

        <div class="day-view" id="dayView"></div>

        <div class="section-title">
            <span class="dot"></span>
            الطلاب
        </div>

        <div class="student-list" id="studentList"></div>

        <div class="add-bar">
            <button class="btn" id="addStudentBtn">
                + إضافة طالب جديد
            </button>

            <a class="btn secondary" href="salary.html">
                حساب السالاري
            </a>

            <button class="btn" id="logoutBtn" style="margin-right: 12px;">
                تسجيل الخروج
            </button>
        </div>

        <div class="status-msg" id="statusMsg"></div>

    </div>

</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/api.js"></script>

<script src="js/app.js"></script>
</body>
</html>
