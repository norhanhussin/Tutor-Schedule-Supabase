<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب السالاري | دفتر مواعيدي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="min-h-screen font-sans text-ink antialiased">
    <main id="salaryShell" class="wrap salary-shell mx-auto w-full max-w-5xl hidden">
        <header class="salary-header">
            <a class="back-link inline-flex items-center gap-2 rounded-full border border-line bg-panel/60 px-4 py-2 text-accent transition hover:border-accent hover:text-ink" href="index.html">العودة للجدول</a>
            <h1 class="font-display">حساب السالاري</h1>
            <div class="today-date text-muted">سجّلي الجلسات التي تمت، والسعر الخاص بكل جلسة</div>
        </header>

        <nav class="mx-auto mb-6 flex max-w-md flex-wrap justify-center gap-2 rounded-2xl border border-line bg-panel/70 p-2" aria-label="صفحات الطلاب" data-site-navigation>
            <a class="rounded-xl px-4 py-2 font-bold text-muted transition hover:bg-panel-raised hover:text-ink" href="index.html">الطلاب</a>
            <a class="rounded-xl px-4 py-2 font-bold text-muted transition hover:bg-panel-raised hover:text-ink" href="missed.html">السيشنات الفائتة</a>
            <a class="rounded-xl bg-accent px-4 py-2 font-bold text-canvas" href="salary.html" aria-current="page">حساب السالاري</a>
        </nav>

        <section class="salary-toolbar salary-daily-item" aria-label="اختيار التاريخ">
            <button class="icon-btn" id="previousDateBtn" type="button">اليوم السابق</button>
            <input id="salaryDate" type="date" aria-label="تاريخ الحساب">
            <button class="icon-btn" id="nextDateBtn" type="button">اليوم التالي</button>
        </section>

        <nav class="salary-view-switcher mx-auto flex max-w-sm gap-2 rounded-2xl border border-line bg-panel/70 p-1.5" aria-label="طريقة العرض">
            <button class="view-switch active flex-1 rounded-xl px-4 py-2 font-bold transition" data-view="day" type="button">اليوم</button>
            <button class="view-switch flex-1 rounded-xl px-4 py-2 font-bold transition" data-view="month" type="button">حساب الشهر</button>
        </nav>

        <div class="salary-date-title salary-daily-item font-display font-bold text-accent" id="salaryDateTitle"></div>

        <section class="stats-grid salary-stats salary-daily-item grid grid-cols-2 gap-3 md:grid-cols-4">
            <div class="stat-card rounded-2xl border border-line bg-panel px-5 py-4 shadow-xl"><span class="stat-label text-muted">جلسات اليوم</span><strong class="stat-value font-display text-accent" id="salarySessionsStat">0</strong></div>
            <div class="stat-card rounded-2xl border border-line bg-panel px-5 py-4 shadow-xl"><span class="stat-label text-muted">حضروا</span><strong class="stat-value font-display text-accent" id="completedSessionsStat">0</strong></div>
            <div class="stat-card rounded-2xl border border-line bg-panel px-5 py-4 shadow-xl"><span class="stat-label text-muted">غياب</span><strong class="stat-value font-display text-danger" id="absentSessionsStat">0</strong></div>
            <div class="stat-card rounded-2xl border border-line bg-panel px-5 py-4 shadow-xl"><span class="stat-label text-muted">إجمالي اليوم</span><strong class="stat-value font-display text-accent" id="dailyTotalStat">0 ج.م</strong></div>
        </section>

        <section class="salary-tools salary-daily-item">
            <label>عرض الطالب
                <select id="studentFilter"><option value="all">كل الطلاب</option></select>
            </label>
            <label>حالة الجلسة
                <select id="attendanceFilter">
                    <option value="all">كل الجلسات</option>
                    <option value="attended">حضر</option>
                    <option value="absent">غاب</option>
                    <option value="cancelled">أُلغيت</option>
                    <option value="postponed">تأجلت</option>
                    <option value="pending">لم يُسجّل</option>
                </select>
            </label>
            <label>ترتيب
                <select id="monthlySort">
                    <option value="name">حسب الاسم</option>
                    <option value="total">حسب الإجمالي</option>
                    <option value="count">حسب عدد الجلسات</option>
                </select>
            </label>
            <button class="btn secondary" id="exportMonthlyBtn" type="button">تصدير تقرير الشهر</button>
        </section>

        <section class="salary-list salary-daily-item flex flex-col gap-3" id="salaryList"></section>
        <div class="status-msg salary-daily-item" id="salaryStatus" role="status" aria-live="polite"></div>

        <section class="focus-card extra-session-card salary-daily-item rounded-2xl border border-line bg-panel p-5 shadow-xl">
            <h2 class="font-display font-bold">إضافة جلسة إضافية أو تجريبية</h2>
            <form id="extraSessionForm" class="extra-session-form grid grid-cols-1 items-end gap-3 md:grid-cols-3">
                <label>اسم الطالب<input id="extraStudentName" type="text" required placeholder="اكتبي اسم الطالب"></label>
                <label>التاريخ<input id="extraSessionDate" type="date" required></label>
                <label>الوقت<input id="extraSessionTime" type="time" value="09:00" required></label>
                <label>السعر<input id="extraSessionPrice" type="number" min="0" step="10" value="80" required inputmode="decimal"></label>
                <button class="btn" type="submit">إضافة وحساب الجلسة</button>
            </form>
        </section>

        <section class="monthly-section salary-monthly-item mt-8">
            <div class="section-title font-display font-bold"><span class="dot"></span>حساب الشهر</div>
            <div class="month-toolbar">
                <label for="salaryMonth">الشهر</label>
                <input id="salaryMonth" type="month" aria-label="شهر الحساب">
            </div>
            <div class="month-comparison" id="monthComparison"></div>
            <div class="monthly-calendar" id="monthlyCalendar"></div>
            <div class="monthly-summary" id="monthlySummary"></div>
        </section>
    </main>

    <div id="salaryLogin" class="wrap salary-login mx-auto min-h-[70vh] w-full max-w-5xl hidden">
        <div class="focus-card rounded-2xl border border-line bg-panel p-8 text-center shadow-xl">
            <h2 class="mb-5 font-display text-2xl font-bold">يجب تسجيل الدخول أولًا</h2>
            <a class="btn inline-flex items-center justify-center rounded-xl bg-accent px-5 py-3 font-bold text-canvas shadow-lg transition hover:-translate-y-0.5" href="index.html">الذهاب لتسجيل الدخول</a>
        </div>
    </div>

    <button class="back-to-top" id="backToTop" type="button" aria-label="العودة إلى أعلى الصفحة">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/sync-status.js"></script>
    <script src="js/api.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/salary.js"></script>
</body>
</html>
